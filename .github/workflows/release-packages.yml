name: Release platform packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach packages to
        type: string
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build

  package:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            package_script: dist:linux
            package_kind: linux
            expected_count: 2
          - os: windows-latest
            package_script: dist:win
            package_kind: windows
            expected_count: 1
          - os: macos-latest
            package_script: dist:mac:x64
            package_kind: mac-x64
            expected_count: 1
          - os: macos-latest
            package_script: dist:mac:arm64
            package_kind: mac-arm64
            expected_count: 1
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != "false" ]]; then
            echo "Release $RELEASE_TAG is not published."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build platform package
        env:
          PACKAGE_SCRIPT: ${{ matrix.package_script }}
        run: npm run "$PACKAGE_SCRIPT"

      - name: Verify package artifacts
        env:
          PACKAGE_KIND: ${{ matrix.package_kind }}
          EXPECTED_COUNT: ${{ matrix.expected_count }}
        shell: bash
        run: |
          case "$PACKAGE_KIND" in
            linux)
              files=(outputs/final-release/FlowState-*-x86_64.AppImage outputs/final-release/FlowState-*-amd64.deb)
              ;;
            mac-x64)
              files=(outputs/final-release/FlowState-*-x64.dmg)
              ;;
            mac-arm64)
              files=(outputs/final-release/FlowState-*-arm64.dmg)
              ;;
            windows)
              files=(outputs/final-release/FlowState-*-x64.exe)
              ;;

            *)
              echo "Unknown package kind: $PACKAGE_KIND"
              exit 1
              ;;
          esac

          if [[ "${#files[@]}" -ne "$EXPECTED_COUNT" ]]; then
            echo "Expected $EXPECTED_COUNT package files, found ${#files[@]}."
            exit 1
          fi

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty package: $file"
              exit 1
            fi
          done

          printf 'Verified package: %s\n' "${files[@]}"

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_KIND: ${{ matrix.package_kind }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          case "$PACKAGE_KIND" in
            linux)
              files=(outputs/final-release/FlowState-*-x86_64.AppImage outputs/final-release/FlowState-*-amd64.deb)
              ;;
            mac-x64)
              files=(outputs/final-release/FlowState-*-x64.dmg)
              ;;
            mac-arm64)
              files=(outputs/final-release/FlowState-*-arm64.dmg)
              ;;
            windows)
              files=(outputs/final-release/FlowState-*-x64.exe)
              ;;
            *)
              echo "Unknown package kind: $PACKAGE_KIND"
              exit 1
              ;;

          esac

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
